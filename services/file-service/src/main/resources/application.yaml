spring:
  application:
    name: file-service
  data:
    mongodb:
      uri: mongodb://localhost:27017/file-service?authSource=admin
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
server:
  port: ${SERVER_PORT:8089}
  servlet:
    context-path: /file

app:
  file:
    storage-dir-avatar: ${FILE_STORAGE_AVATAR:/data/media/}
    storage-dir-video: ${FILE_STORAGE_VIDEO:/data/media-video/}
    download-prefix: ${FILE_DOWNLOAD_PREFIX:http://localhost:8089/file/media/download/}
