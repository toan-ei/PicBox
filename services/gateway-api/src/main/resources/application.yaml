server:
  port: ${SERVER_PORT:8080}

app:
  api-prefix: ""

identity:
  base-url: ${IDENTITY_BASE_URL:http://localhost:8087}

services:
  identity: ${IDENTITY_SERVICE_URL:http://localhost:8087}
  profile: ${PROFILE_SERVICE_URL:http://localhost:8081}
  order: ${ORDER_SERVICE_URL:http://localhost:8082}
  payment: ${PAYMENT_SERVICE_URL:http://localhost:8083}
  tracking: ${TRACKING_SERVICE_URL:http://localhost:8088}
  hub: ${HUB_SERVICE_URL:http://localhost:8084}
  staff: ${STAFF_SERVICE_URL:http://localhost:8085}
  notification: ${NOTIFICATION_SERVICE_URL:http://localhost:8086}

spring:
  application:
    name: gateway-api
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: identity-service
              uri: ${IDENTITY_SERVICE_URL:http://localhost:8087}
              predicates:
                - Path=/identity/**

            - id: profile-service
              uri: ${PROFILE_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/profile/**

            - id: order-service
              uri: ${ORDER_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/order/**

            - id: payment-service
              uri: ${PAYMENT_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/payment/**

            - id: tracking-service
              uri: ${TRACKING_SERVICE_URL:http://localhost:8088}
              predicates:
                - Path=/tracking/**

            - id: hub-and-branch-service
              uri: ${HUB_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/hub/**

            - id: staff-service
              uri: ${STAFF_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/staff/**

            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8086}
              predicates:
                - Path=/notification/**

            - id: file-service
              uri: ${FILE_SERVICE_URL:http://localhost:8089}
              predicates:
                - Path=/file/**
