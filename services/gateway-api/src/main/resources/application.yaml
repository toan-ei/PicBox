server:
  port: 9999

app:
  api-prefix: /api

spring:
  application:
    name: gateway-api
  cloud:
    gateway:
      mvc:
        routes:
          - id: identity-service
            uri: http://localhost:8080
            predicates:
              - Path=${app.api-prefix}/identity/**
            filters:
              - StripPrefix=1
          - id: profile-service
            uri: http://localhost:8081
            predicates:
              - Path=${app.api-prefix}/profile/**
            filters:
              - StripPrefix=1
          - id: order-service
            uri: http://localhost:8082
            predicates:
              - Path=${app.api-prefix}/order/**
            filters:
              - StripPrefix=1
          - id: payment-service
            uri: http://localhost:8083
            predicates:
              - Path=${app.api-prefix}/payment/**
            filters:
              - StripPrefix=1
          - id: tracking-service
            uri: http://localhost:8083
            predicates:
              - Path=${app.api-prefix}/tracking/**
            filters:
              - StripPrefix=1
          - id: hub-and-branch-service
            uri: http://localhost:8084
            predicates:
              - Path=${app.api-prefix}/hub/**
            filters:
              - StripPrefix=1
          - id: staff-service
            uri: http://localhost:8085
            predicates:
              - Path=${app.api-prefix}/staff/**
            filters:
              - StripPrefix=1