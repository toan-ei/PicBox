server:
  port: ${SERVER_PORT:8080}

app:
  api-prefix: ""

identity:
  base-url: ${IDENTITY_BASE_URL:http://localhost:8087}

spring:
  application:
    name: gateway-api
  cloud:
    gateway:
      routes:
        - id: identity-service
          uri: http://localhost:${IDENTITY_PORT:8087}
          predicates:
            - Path=/identity/**

        - id: profile-service
          uri: http://localhost:8081
          predicates:
            - Path=/profile/**

        - id: order-service
          uri: http://localhost:8082
          predicates:
            - Path=/order/**

        - id: payment-service
          uri: http://localhost:8083
          predicates:
            - Path=/payment/**

        - id: tracking-service
          uri: http://localhost:8088
          predicates:
            - Path=/tracking/**

        - id: hub-and-branch-service
          uri: http://localhost:8084
          predicates:
            - Path=/hub/**

        - id: staff-service
          uri: http://localhost:8085
          predicates:
            - Path=/staff/**
