server:
  port: 8080

spring:
  application:
    name: gateway-api
  cloud:
    gateway:
      mvc:
        routes:
          - id: identity-service
            uri: http://identity-service:8080
            predicates:
              - Path=/identity/**

          - id: profile-service
            uri: http://profile-service:8081
            predicates:
              - Path=/profile/**

          - id: order-service
            uri: http://order-service:8082
            predicates:
              - Path=/order/**

          - id: payment-service
            uri: http://payment-service:8083
            predicates:
              - Path=/payment/**

          - id: tracking-service
            uri: http://tracking-service:8083
            predicates:
              - Path=/tracking/**

          - id: hub-and-branch-service
            uri: http://hub-and-branch-service:8084
            predicates:
              - Path=/hub/**

          - id: staff-service
            uri: http://staff-service:8085
            predicates:
              - Path=/staff/**
