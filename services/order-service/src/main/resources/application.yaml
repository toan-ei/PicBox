server:
  port: 8081
  servlet:
    context-path: /order

spring:
  application:
    name: order-service
  datasource:
    url: "jdbc:mysql://localhost:3306/order_service"
    username: root
    password: 1234
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

jwt:
  signerKey: "BcGAKAxY7nEWT4lOBlPMxo4lgdgurBlEuL5wlzxqSuUauQI5+2G6I6A6KRe38XhF"

feign:
  client:
    config:
      payment-service:
        url: http://localhost:8082/payment
      staff-service:
        url: http://localhost:8083/staff
