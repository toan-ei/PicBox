name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  ci-backend:
    name: Build — ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - gateway-api
          - identity-service
          - profile-service
          - order-service
          - payment-service
          - tracking-service
          - notification-service
          - hub-and-branch-service
          - staff-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Build
        working-directory: services/${{ matrix.service }}
        run: mvn clean package -B -DskipTests

  ci-frontend:
    name: Build — ${{ matrix.app }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        app:
          - sender-web
          - admin-web
          - ops-dashboard
          - shipper-portal
          - driver-portal

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        working-directory: apps/${{ matrix.app }}
        run: npm ci

      - name: Build
        working-directory: apps/${{ matrix.app }}
        run: npm run build
