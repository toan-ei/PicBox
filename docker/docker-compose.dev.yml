version: "3.9"

# ──────────────────────────────────────────────────────────────
#  Biến môi trường dùng chung cho backend services
# ──────────────────────────────────────────────────────────────
x-db-env: &db-env
  DB_HOST: mysql
  DB_PORT: 3306
  DB_USERNAME: dev
  DB_PASSWORD: ${MYSQL_PASSWORD:-devpass}

x-kafka-env: &kafka-env
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092

x-redis-env: &redis-env
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:-devpass}

x-jwt-env: &jwt-env
  JWT_SIGNER_KEY: ${JWT_SIGNER_KEY:-BcGAKAxY7nEWT4lOBlPMxo4lgdgurBlEuL5wlzxqSuUauQI5+2G6I6A6KRe38XhF}

services:

  # ════════════════════════════════════════════════════════════
  #  INFRASTRUCTURE
  # ════════════════════════════════════════════════════════════

  mysql:
    image: mysql:8.0
    container_name: picbox-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-devpass}
      MYSQL_USER: dev
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-devpass}
    ports:
      - "3306:3306"
    volumes:
      - mysqldata:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-devpass}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mongodb:
    image: mongo:7
    container_name: picbox-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-dev}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-devpass}
      MONGO_INITDB_DATABASE: tracking_db
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "-u", "dev", "-p", "devpass", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: picbox-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-devpass}
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-devpass}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: picbox-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zkdata:/var/lib/zookeeper/data
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: picbox-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    container_name: picbox-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ../infra/kafka/init-topics.sh:/init-topics.sh
    entrypoint: ["/bin/bash", "/init-topics.sh"]

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: picbox-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    restart: unless-stopped

  # ════════════════════════════════════════════════════════════
  #  BACKEND SERVICES
  # ════════════════════════════════════════════════════════════

  gateway-api:
    build:
      context: ../services/gateway-api
    container_name: picbox-gateway
    ports:
      - "8080:8080"
    depends_on:
      - identity-service
      - profile-service
      - order-service
      - payment-service
      - tracking-service
      - hub-and-branch-service
      - staff-service
    restart: unless-stopped

  identity-service:
    build:
      context: ../services/identity-service
    container_name: picbox-identity
    environment:
      <<: [*db-env, *jwt-env]
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  profile-service:
    build:
      context: ../services/profile-service
    container_name: picbox-profile
    environment:
      <<: [*db-env, *kafka-env, *jwt-env]
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  order-service:
    build:
      context: ../services/order-service
    container_name: picbox-order
    environment:
      <<: [*db-env, *kafka-env, *redis-env, *jwt-env]
      PAYMENT_SERVICE_URL: http://payment-service:8083/payment
      STAFF_SERVICE_URL: http://staff-service:8085/staff
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  payment-service:
    build:
      context: ../services/payment-service
    container_name: picbox-payment
    environment:
      <<: [*db-env, *kafka-env, *jwt-env]
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  tracking-service:
    build:
      context: ../services/tracking-service
    container_name: picbox-tracking
    environment:
      <<: [*kafka-env, *redis-env]
      MONGO_HOST: mongodb
      MONGO_USER: ${MONGO_USER:-dev}
      MONGO_PASSWORD: ${MONGO_PASSWORD:-devpass}
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  hub-and-branch-service:
    build:
      context: ../services/hub-and-branch-service
    container_name: picbox-hub
    environment:
      <<: [*db-env, *redis-env, *jwt-env]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  staff-service:
    build:
      context: ../services/staff-service
    container_name: picbox-staff
    environment:
      <<: [*db-env, *kafka-env, *redis-env, *jwt-env]
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  notification-service:
    build:
      context: ../services/notification-service
    container_name: picbox-notification
    environment:
      <<: *kafka-env
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # ════════════════════════════════════════════════════════════
  #  FRONTEND APPS
  # ════════════════════════════════════════════════════════════

  sender-web:
    build:
      context: ../apps
      dockerfile: sender-web/Dockerfile
    container_name: picbox-sender-web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    restart: unless-stopped

  admin-web:
    build:
      context: ../apps
      dockerfile: admin-web/Dockerfile
    container_name: picbox-admin-web
    ports:
      - "3001:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    restart: unless-stopped

  shipper-portal:
    build:
      context: ../apps
      dockerfile: shipper-portal/Dockerfile
    container_name: picbox-shipper-portal
    ports:
      - "3002:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    restart: unless-stopped

  driver-portal:
    build:
      context: ../apps
      dockerfile: driver-portal/Dockerfile
    container_name: picbox-driver-portal
    ports:
      - "3003:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    restart: unless-stopped

  ops-dashboard:
    build:
      context: ../apps
      dockerfile: ops-dashboard/Dockerfile
    container_name: picbox-ops-dashboard
    ports:
      - "3004:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    restart: unless-stopped

volumes:
  mysqldata:
  mongodata:
  redisdata:
  zkdata:
