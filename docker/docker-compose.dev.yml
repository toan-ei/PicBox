# ──────────────────────────────────────────────────────────────
#  Biến môi trường dùng chung
# ──────────────────────────────────────────────────────────────
x-db-env: &db-env
  DB_HOST: mysql
  DB_PORT: 3306
  DB_USERNAME: dev
  DB_PASSWORD: ${MYSQL_PASSWORD:-devpass}

x-kafka-env: &kafka-env
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092

x-redis-env: &redis-env
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:-devpass}

x-jwt-env: &jwt-env
  JWT_SIGNER_KEY: ${JWT_SIGNER_KEY:-BcGAKAxY7nEWT4lOBlPMxo4lgdgurBlEuL5wlzxqSuUauQI5+2G6I6A6KRe38XhF}

# Java services: JVM dùng 75% của 512MB = ~384MB heap
x-java-svc: &java-svc
  restart: unless-stopped
  deploy:
    resources:
      limits:
        memory: 512m

services:

  # ════════════════════════════════════════════════════════════
  #  INFRASTRUCTURE
  # ════════════════════════════════════════════════════════════

  mysql:
    image: mysql:8.0
    container_name: picbox-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-devpass}
      MYSQL_USER: dev
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-devpass}
    ports:
      - "3307:3306"
    volumes:
      - mysqldata:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-devpass}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m

  mongodb:
    image: mongo:7
    container_name: picbox-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-dev}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-devpass}
      MONGO_INITDB_DATABASE: tracking_db
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "-u", "dev", "-p", "devpass", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m

  redis:
    image: redis:7-alpine
    container_name: picbox-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-devpass}
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-devpass}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128m

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: picbox-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zkdata:/var/lib/zookeeper/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: picbox-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m

  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    container_name: picbox-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ../infra/kafka/init-topics.sh:/init-topics.sh
    entrypoint: ["/bin/bash", "/init-topics.sh"]

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: picbox-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m

  # ════════════════════════════════════════════════════════════
  #  BACKEND SERVICES
  # ════════════════════════════════════════════════════════════

  gateway-api:
    <<: *java-svc
    build:
      context: ../services/gateway-api
    container_name: picbox-gateway
    ports:
      - "8080:8080"
    environment:
      <<: *jwt-env
      IDENTITY_BASE_URL: http://identity-service:8087
      IDENTITY_SERVICE_URL: http://identity-service:8087
      PROFILE_SERVICE_URL: http://profile-service:8081
      ORDER_SERVICE_URL: http://order-service:8082
      PAYMENT_SERVICE_URL: http://payment-service:8083
      TRACKING_SERVICE_URL: http://tracking-service:8088
      HUB_SERVICE_URL: http://hub-and-branch-service:8084
      STAFF_SERVICE_URL: http://staff-service:8085
      NOTIFICATION_SERVICE_URL: http://notification-service:8086
      FILE_SERVICE_URL: http://file-service:8089
    depends_on:
      - identity-service
      - profile-service
      - order-service
      - payment-service
      - tracking-service
      - hub-and-branch-service
      - staff-service
      - notification-service

  identity-service:
    <<: *java-svc
    build:
      context: ../services/identity-service
    container_name: picbox-identity
    environment:
      <<: [*db-env, *jwt-env]
    depends_on:
      mysql:
        condition: service_healthy

  profile-service:
    <<: *java-svc
    build:
      context: ../services/profile-service
    container_name: picbox-profile
    environment:
      <<: [*db-env, *kafka-env, *jwt-env]
      FILE_SERVICE_URL: http://file-service:8089/file
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy

  order-service:
    <<: *java-svc
    build:
      context: ../services/order-service
    container_name: picbox-order
    environment:
      <<: [*db-env, *kafka-env, *redis-env, *jwt-env]
      PAYMENT_SERVICE_URL: http://payment-service:8083/payment
      STAFF_SERVICE_URL: http://staff-service:8085/staff
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy

  payment-service:
    <<: *java-svc
    build:
      context: ../services/payment-service
    container_name: picbox-payment
    environment:
      <<: [*db-env, *kafka-env, *jwt-env]
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy

  tracking-service:
    <<: *java-svc
    build:
      context: ../services/tracking-service
    container_name: picbox-tracking
    environment:
      <<: [*kafka-env, *redis-env]
      MONGO_HOST: mongodb
      MONGO_USER: ${MONGO_USER:-dev}
      MONGO_PASSWORD: ${MONGO_PASSWORD:-devpass}
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy

  hub-and-branch-service:
    <<: *java-svc
    build:
      context: ../services/hub-and-branch-service
    container_name: picbox-hub
    environment:
      <<: [*db-env, *redis-env, *jwt-env]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  staff-service:
    <<: *java-svc
    build:
      context: ../services/staff-service
    container_name: picbox-staff
    environment:
      <<: [*db-env, *kafka-env, *redis-env, *jwt-env]
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy

  file-service:
    <<: *java-svc
    build:
      context: ../services/file-service
    container_name: picbox-file
    environment:
      FILE_SERVICE_URL: http://file-service:8089/file
      FILE_DOWNLOAD_PREFIX: http://localhost:8089/file/media/download/
    volumes:
      - filedata:/data
    depends_on:
      mongodb:
        condition: service_healthy

  notification-service:
    <<: *java-svc
    build:
      context: ../services/notification-service
    container_name: picbox-notification
    environment:
      <<: [*db-env, *kafka-env]
      DB_NAME: notification_service
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    depends_on:
      kafka:
        condition: service_healthy
      mysql:
        condition: service_healthy

  # ════════════════════════════════════════════════════════════
  #  FRONTEND APPS  (dev: chạy local với npm run dev)
  # ════════════════════════════════════════════════════════════

  sender-web:
    build:
      context: ../apps
      dockerfile: sender-web/Dockerfile
    container_name: picbox-sender-web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m

  admin-web:
    build:
      context: ../apps
      dockerfile: admin-web/Dockerfile
    container_name: picbox-admin-web
    ports:
      - "3001:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m

  shipper-portal:
    build:
      context: ../apps
      dockerfile: shipper-portal/Dockerfile
    container_name: picbox-shipper-portal
    ports:
      - "3002:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m

  driver-portal:
    build:
      context: ../apps
      dockerfile: driver-portal/Dockerfile
    container_name: picbox-driver-portal
    ports:
      - "3003:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m

  ops-dashboard:
    build:
      context: ../apps
      dockerfile: ops-dashboard/Dockerfile
    container_name: picbox-ops-dashboard
    ports:
      - "3004:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m

  # ════════════════════════════════════════════════════════════
  #  SEED SERVICE  (chay 1 lan de tao du lieu fake)
  #  Dung: docker compose run --rm seed
  # ════════════════════════════════════════════════════════════

  seed:
    image: python:3.12-slim
    container_name: picbox-seed
    profiles: ["seed"]
    working_dir: /app
    volumes:
      - ./seed-big.py:/app/seed-big.py:ro
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: dev
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-devpass}
    command: >
      sh -c "pip install pymysql bcrypt -q &&
             python seed-big.py"
    depends_on:
      mysql:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128m

volumes:
  mysqldata:
  mongodata:
  redisdata:
  zkdata:
  filedata:
